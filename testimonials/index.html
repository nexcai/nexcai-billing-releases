<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer testimonials</title><base target="_blank"></head>
<body style="margin:0;background:transparent">
<!-- Customer testimonials: paste this where you want them to appear on the page. -->
<section class="nxc-t">
  <style>
    .nxc-t,.nxc-t *{box-sizing:border-box}
    .nxc-t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:1100px;margin:0 auto;padding:24px 16px;color:#1c2230}
    .nxc-t h2{text-align:center;margin:0 0 20px;color:#f2f4f8} /* light: the Nexcai site is dark; the cards below stay white */

    .nxc-card{margin:0;padding:18px;border:1px solid #e3e6ec;border-radius:10px;background:#fff;color:#1c2230}
    .nxc-stars{color:#f5a623;font-size:18px;letter-spacing:2px}
    .nxc-card blockquote{margin:10px 0;line-height:1.5}
    .nxc-card figcaption{font-weight:600;font-size:14px;color:#555}
    .nxc-btn{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:6px;background:#2f5bea;color:#fff;text-decoration:none}
    .nxc-foot{text-align:center}
  </style>
  <h2>What our customers say</h2>
  <div class="nxc-grid">

    <figure class="nxc-card"><div class="nxc-stars" role="img" aria-label="5 out of 5 stars">★★★★★</div><blockquote>Prompt delivery</blockquote><figcaption>Sanjay bisht, Puranabazzar</figcaption></figure>
  </div>

</section>
</body></html>
